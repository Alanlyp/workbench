<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>创作工作台</title>
<!-- 公网地址: https://alanlyp.github.io/workbench/  更新流程: 改完本文件后执行
     cp 本文件 ~/Desktop/opencode/workbench-pages/index.html && cd ~/Desktop/opencode/workbench-pages && git add -A && git commit -m "update" && git push
     约1分钟生效。file://素材链接仅本机有效。Hermes 每次改源数据把 REV+1（用于清用户端已同步草稿）。 -->
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4f4f6;color:#17171a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;line-height:1.55}
  .page{max-width:780px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{font-size:13px;color:#6b7280;margin-bottom:16px}
  .sub a{color:#2f6fed;text-decoration:none}
  .card{border:1px solid #e2e2e6;background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .card h3{font-size:15px;margin:0 0 8px}
  .card h3 .cnt{font-size:12px;color:#6b7280;font-weight:400;margin-left:6px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid .card{margin-bottom:0}
  input[type=text]{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:8px}
  button{font-size:13px;padding:6px 16px;border-radius:8px;border:1px solid #2f6fed;background:#2f6fed;color:#fff;cursor:pointer}
  button:hover{background:#1e54cc}
  button.ghost{background:#fff;color:#2f6fed}
  button.ghost:hover{background:#eef4ff}
  .mini{width:auto;font-size:12px;padding:3px 9px;border-radius:6px;border:1px solid #ddd;background:#fff;color:#555}
  .mini:hover{background:#f0f0f2;color:#17171a}
  .mini.del{color:#dc2626;border-color:#fecaca}
  .fgsel{font-size:12px;padding:3px 4px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#555;max-width:96px;cursor:pointer}
  .banner .send{background:#2f6fed;color:#fff;border-color:#2f6fed;padding:7px 14px;font-size:13px;width:auto}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
  .dot.g{background:#22c55e}.dot.b{background:#3b82f6}.dot.y{background:#eab308}
  .links a{display:block;font-size:13px;color:#2f6fed;text-decoration:none;padding:3px 0}
  .links a:hover{text-decoration:underline}
  .matrow{display:flex;gap:8px;align-items:center;justify-content:space-between}
  .matrow a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .plist a.item,.plist div.item{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid #e8e8ec;border-radius:10px;margin-bottom:8px;background:#fafafa;text-decoration:none;color:#17171a}
  .plist a.item:hover{border-color:#2f6fed}
  .plist .t{font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .plist .m{font-size:12px;color:#6b7280;margin-left:auto;white-space:nowrap}
  .rowacts{display:flex;gap:6px;margin:-2px 0 8px;flex-wrap:wrap;align-items:center}
  .rowacts .lbl{font-size:12px;color:#6b7280}
  .empty{font-size:13px;color:#999;padding:6px 2px}
  .banner{border:1px solid #f59e0b;background:#fffbeb;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .now{border:1px solid #2f6fed;background:#eef4ff;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}
  .now b{color:#2f6fed}
  .back{font-size:13px;color:#2f6fed;cursor:pointer;display:inline-block;margin-bottom:10px}
  .bar{height:8px;background:#e4e4e9;border-radius:4px;overflow:hidden;margin-bottom:6px}
  .bar i{display:block;height:100%;background:#2f6fed;transition:width .3s}
  .bartxt{font-size:12px;color:#6b7280;margin-bottom:12px}
  .step{border:1px solid #e2e2e6;background:#fff;border-radius:12px;padding:13px 16px;margin-bottom:11px}
  .step.doing{border-color:#2f6fed;box-shadow:0 1px 6px rgba(47,111,237,.12)}
  .step.done{background:#fafafa}
  .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .no{font-weight:700;font-size:14px}
  .who{font-size:12px;border:1px solid #ddd;border-radius:10px;padding:1px 8px;color:#555;background:#f7f7f9}
  .st{margin-left:auto;font-size:13px;color:#6b7280}
  .doing .st{color:#2f6fed;font-weight:600}
  .done .st{color:#16a34a;font-weight:600}
  .desc{font-size:13px;color:#444;margin-top:5px}
  .acts{margin-top:9px}
  .foot{font-size:12px;color:#999;margin-top:16px;border-top:1px solid #e4e4e9;padding-top:12px}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#17171a;color:#fff;font-size:13px;padding:8px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92%;text-align:center}
  .toast.show{opacity:1}
  /* 手机端 H5：放在样式表末尾保证覆盖桌面规则 */
  @media (max-width:600px){
    .page{padding:18px 14px 50px}
    h1{font-size:19px}
    .sub{font-size:12px}
    .card{padding:12px 13px}
    input[type=text]{font-size:16px;padding:11px 12px}
    button{width:100%;padding:12px 16px;font-size:15px}
    .mini,.banner .send{width:auto;padding:9px 13px;font-size:14px}
    .fgsel{font-size:15px;padding:8px 6px;max-width:120px}
    .plist a.item,.plist div.item{flex-wrap:wrap;gap:2px 8px;padding:10px}
    .plist .t{font-size:15px}
    .step{padding:12px 13px}
    .no{font-size:15px}
    .desc,.out,.links a,.now{font-size:14px}
    .back{font-size:15px;padding:8px 0;display:block}
  }
</style>
</head>
<body>
<div class="page">
  <h1 id="apph">🗂 创作工作台</h1>
  <div class="sub">四步法：AI调研 → 搭框架 → 注入故事(你) → 润色 · 每步完成后 Hermes 更新本页，浏览器 ⌘R 刷新</div>

  <div id="view-home">
    <div id="banner"></div>

    <div class="grid">
      <div class="card">
        <h3>▶ 开始创作</h3>
        <input type="text" id="nt" placeholder="新创意，例如：车墩白天与夜晚">
        <button id="nb">✨ 创建新项目</button>
        <div class="empty" style="margin-top:6px">创建后进「待拍脚本」，改完点顶部「📤 同步」发给 Hermes 归档</div>
      </div>
      <div class="card">
        <h3>📚 素材库<span class="cnt" id="cm"></span></h3>
        <div class="links" id="mat"></div>
        <div id="matadd" style="display:none">
          <input type="text" id="mn" placeholder="素材名称，例如：爆款拆解脚本">
          <input type="text" id="ml" placeholder="链接（https:// 或 file:///）">
          <button class="ghost" id="mb">＋ 添加素材</button>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:12px">
      <h3>📝 待拍脚本<span class="cnt" id="c1"></span></h3>
      <div class="plist" id="l1"></div>
    </div>

    <div class="card">
      <h3>🎬 已拍作品<span class="cnt" id="c2"></span></h3>
      <div class="plist" id="l2"></div>
    </div>

    <div class="card">
      <h3>🗑 选题垃圾箱<span class="cnt" id="c3"></span><span id="tbw"></span></h3>
      <div class="plist" id="l3"></div>
    </div>

    <div class="foot" id="homefoot"></div>
  </div>

  <div id="view-proj" style="display:none"></div>
</div>
<div class="toast" id="toast"></div>
<script>
// ponytail: 线上真身=本文件 REV/MATERIALS/PROJECTS/TRASH；页面编辑存 localStorage 草稿，
// 点「同步」把 JSON 发回 Hermes → Hermes 写入源文件、REV+1、push。无后端，够用到需要多端直写为止。
// XSS说明：渲染数据统一过 esc() 转义；banner/foot 的 innerHTML 只拼常量与数字（D.n 强制转 Number）。
const REV=2;
const MATERIALS=[
  ['📁 口播稿总目录','file:///Users/liuyiping/Desktop/Alan-Database/口播稿/'],
  ['📁 转录原稿','file:///Users/liuyiping/Desktop/opencode/转录原稿/'],
  ['📄 四步法参考视频拆解','file:///Users/liuyiping/Desktop/opencode/转录原稿/2026-10-23-BV1z3SiBsEig-AI爆款文案四步法-转录与拆解.md']
];
const PROJECTS=[
  {id:'chedun',title:'车墩：白天一座空城，夜晚挤满人',date:'2026-10-23',status:'script',stage:0,
   extra:[['素材库(车墩v1)','file:///Users/liuyiping/Desktop/Alan-Database/口播稿/07-城市烟火气/2026-10-23-车墩-白天的安静与夜晚的烟火气.md'],
          ['参考视频拆解','file:///Users/liuyiping/Desktop/opencode/转录原稿/2026-10-23-BV1z3SiBsEig-AI爆款文案四步法-转录与拆解.md']]}
];
const TRASH=[];
const STEPS=[
  ['Step 1 · AI调研','🤖 Hermes','痛点、钩子池、选题池≥10个'],
  ['Step 2 · 搭框架','🤖 Hermes','Story框架分段大纲，段落级、不写正文'],
  ['Step 3 · 注入故事','✍️ 你','踩点亲眼所见+你自己的经历视角'],
  ['Step 4 · 润色定稿','🤖 Hermes','删车轱辘话、改口语、查错字、核时长']
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LB={todo:'未开始',doing:'进行中',done:'✅ 完成'};
const today=()=>new Date().toISOString().slice(0,10);
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200);}
const STAGELB=s=>s===0?'未启动':s>=5?'文稿定稿 ✅':'Step '+s+' 进行中';
const flagDot=p=>p.flag?`<span class="dot ${p.flag==='g'?'g':p.flag==='b'?'b':'y'}"></span>`:'';

// ---- 用户端草稿（localStorage）----
let D=null;
try{D=JSON.parse(localStorage.getItem('wt-draft')||'null');
  if(D){D.n=(+D.n)||0;if(!Array.isArray(D.trash))D.trash=[];
    if(D.sent&&D.baseline<REV){localStorage.removeItem('wt-draft');D=null;}}}catch(e){D=null;}
let editing=false;
const mats=()=>D?D.materials:MATERIALS;
const projs=()=>D?D.projects:PROJECTS;
const trash=()=>D?D.trash:TRASH;
function ensureDraft(){if(!D){D={n:0,baseline:REV,sent:false,
  materials:JSON.parse(JSON.stringify(MATERIALS)),projects:JSON.parse(JSON.stringify(PROJECTS)),trash:JSON.parse(JSON.stringify(TRASH))};
  localStorage.setItem('wt-draft',JSON.stringify(D));}}
function saveDraft(){D={n:(D?D.n:0)+1,baseline:D?D.baseline:REV,sent:false,materials:mats(),projects:projs(),trash:trash()};
  localStorage.setItem('wt-draft',JSON.stringify(D));}
function sendDraft(){
  const payload='工作台同步：'+JSON.stringify({materials:mats(),projects:projs(),trash:trash()});
  if(window.hermes&&window.hermes.send){window.hermes.send(payload);toast('已发送给 Hermes');}
  else navigator.clipboard.writeText(payload).then(()=>toast('已复制，马上粘贴发给 Hermes')).catch(()=>toast('复制失败，请手动操作'));
  D.sent=true;localStorage.setItem('wt-draft',JSON.stringify(D));renderHome();
}

// ---- 首页 ----
function renderHome(){
  const P=projs(),M=mats(),T=trash();
  const scr=P.filter(p=>p.status==='script'),shot=P.filter(p=>p.status==='shot');
  document.getElementById('c1').textContent=scr.length+' 个';
  document.getElementById('c2').textContent=shot.length+' 个';
  document.getElementById('c3').textContent=T.length+' 个';
  document.getElementById('cm').textContent=M.length+' 项';
  document.getElementById('tbw').innerHTML=T.length?' <button class="mini del" id="tb">🗑 清空垃圾箱</button>':'';
  if(T.length)document.getElementById('tb').onclick=()=>{if(confirm('清空垃圾箱？'+T.length+' 个选题将彻底删除，无法恢复。')){
    ensureDraft();trash().length=0;saveDraft();renderHome();}};
  const eb=document.getElementById('editbtn');
  if(eb){eb.textContent=editing?'✔ 完成编辑':'✎ 编辑';eb.onclick=()=>{editing=!editing;renderHome();};}
  document.getElementById('matadd').style.display=editing?'':'none';
  document.getElementById('banner').innerHTML=(D&&D.n>0)
    ?`<div class="banner">📝 有 ${D.n} 项修改${D.sent?'（已复制，记得粘贴发送）':'待同步'}`
      +(D.sent?'<button class="mini" id="bs2">📤 再次同步</button>':'<button class="mini send" id="bs">📤 同步给 Hermes</button><button class="mini del" id="bd">放弃修改</button>')+'</div>'
    :'';
  if(D&&D.n>0){
    if(D.sent)document.getElementById('bs2').onclick=sendDraft;
    else{document.getElementById('bs').onclick=sendDraft;
      document.getElementById('bd').onclick=()=>{if(confirm('放弃全部修改，恢复线上版本？')){localStorage.removeItem('wt-draft');location.reload();}};}
  }
  document.getElementById('mat').innerHTML=(M.length?M.map((m,i)=>
    editing
    ?`<div class="matrow"><a href="${esc(m[1])}" onclick="return false" style="color:#6b7280">${esc(m[0])}</a><button class="mini del" data-mdel="${i}">✕</button></div>`
    :`<a href="${esc(m[1])}">${esc(m[0])}</a>`).join(''):'<div class="empty">还没有素材，点右上「✎ 编辑」添加</div>');
  const fgSel=p=>`<select class="fgsel" data-fgs="${esc(p.id)}" title="优先级旗标：⚪无 🟢绿 🔵蓝 🟡黄"><option value="">⚪</option>${['g','b','y'].map(c=>
    `<option value="${c}"${p.flag===c?' selected':''}>${c==='g'?'🟢':c==='b'?'🔵':'🟡'}</option>`).join('')}</select>`;
  const delBtn=p=>`<button class="mini del" data-del="${esc(p.id)}" title="删除（进垃圾箱）">✕</button>`;
  const itemInner=(p,meta,withFg,withDel)=>
    (withFg?fgSel(p):flagDot(p))+`<span class="t">${esc(p.title)}</span><span class="m">${meta(p)}</span>`+(withDel?delBtn(p):'');
  // always=true（待拍脚本）：下拉选旗在标题行左侧、✕删除在行末（状态旁）常驻；已拍作品仅编辑模式出操作
  const row=(p,meta,always)=>{
    const inner=itemInner(p,meta,always,always);
    if(editing){
      const ops=(always?'':fgSel(p))
        +`<button class="mini" data-ren="${esc(p.id)}">✎ 改名</button>
           <button class="mini" data-mov="${esc(p.id)}">${p.status==='script'?'➜ 移到已拍':'➜ 移回待拍'}</button>`
        +(always?'':delBtn(p));
      return `<div class="item">${inner}</div><div class="rowacts">${ops}</div>`;
    }
    if(always)return `<div class="item" data-go="${esc(p.id)}">${inner}</div>`;
    return `<a class="item" href="#/p/${esc(p.id)}">${itemInner(p,meta,false,false)}</a>`;
  };
  document.getElementById('l1').innerHTML=scr.length?scr.map(p=>row(p,x=>STAGELB(x.stage),true)).join(''):'<div class="empty">还没有，「开始创作」建档后出现在这里</div>';
  document.getElementById('l2').innerHTML=shot.length?shot.map(p=>row(p,x=>'已拍摄 '+(esc(x.shotdate)||''),false)).join(''):'<div class="empty">还没有，拍摄完成的项目会移到这里</div>';
  document.getElementById('l3').innerHTML=T.length?T.map(p=>
    `<div class="item">${flagDot(p)}<span class="t" style="color:#6b7280">${esc(p.title)}</span><span class="m">删除于 ${esc(p.trashdate||'')}</span></div>
     <div class="rowacts"><button class="mini" data-res="${esc(p.id)}">↩ 恢复到「${p.status==='shot'?'已拍':'待拍'}」</button></div>`).join('')
    :'<div class="empty">垃圾箱是空的。删除的选题会先进这里，可随时恢复。</div>';
  document.getElementById('homefoot').innerHTML=editing
    ?'编辑模式：改完点顶部「📤 同步给 Hermes」，我写入档案并发布。<b>同步发送前别关页面、别清缓存。</b> 下拉框选旗标颜色（无/绿/蓝/黄）；✕删除＝进垃圾箱（可恢复）。'
    :'待拍脚本＝创作完成、还没拍摄 —— <b>每行左边下拉框选旗标颜色，行末红色✕删除（每次弹确认，进垃圾箱可恢复）</b>，都在标题行上、不用编辑模式；已拍作品＝已拍摄完成。点标题行进四步进度页；改名、移动、素材编辑用右上「✎ 编辑」。';
  // 待拍行是 div（行内有按钮，不能套 a）：点行进项目页，点行内按钮不算
  document.querySelectorAll('[data-go]').forEach(d=>d.onclick=e=>{if(e.target.closest('button,select'))return;
    location.hash='#/p/'+d.dataset.go;});
  document.querySelectorAll('[data-mdel]').forEach(b=>b.onclick=()=>{ensureDraft();mats().splice(+b.dataset.mdel,1);saveDraft();renderHome();});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ensureDraft();const p=projs().find(x=>x.id===b.dataset.del);
    if(p&&confirm('删除《'+p.title+'》？（进选题垃圾箱，可恢复）')){projs().splice(projs().indexOf(p),1);p.trashdate=today();trash().unshift(p);saveDraft();renderHome();}});
  document.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{ensureDraft();const p=projs().find(x=>x.id===b.dataset.ren);const t=prompt('新标题：',p.title);if(t&&t.trim()){p.title=t.trim();saveDraft();renderHome();}});
  document.querySelectorAll('[data-mov]').forEach(b=>b.onclick=()=>{ensureDraft();const p=projs().find(x=>x.id===b.dataset.mov);
    p.status=p.status==='script'?'shot':'script';
    if(p.status==='shot')p.shotdate=today();else delete p.shotdate;
    saveDraft();renderHome();});
  document.querySelectorAll('[data-fgs]').forEach(s=>s.onchange=()=>{ensureDraft();
    const p=projs().find(x=>x.id===s.dataset.fgs);
    if(p){if(s.value)p.flag=s.value;else delete p.flag;saveDraft();renderHome();}});
  document.querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>{ensureDraft();
    const p=trash().find(x=>x.id===b.dataset.res);
    if(p){trash().splice(trash().indexOf(p),1);delete p.trashdate;projs().unshift(p);saveDraft();renderHome();toast('已恢复');}});
}
document.getElementById('nb').onclick=()=>{
  const t=document.getElementById('nt').value.trim();
  if(!t){toast('先填个创意名字');return;}
  ensureDraft();
  projs().unshift({id:'p'+Date.now().toString(36),title:t,date:today(),status:'script',stage:0,extra:[]});
  document.getElementById('nt').value='';
  saveDraft();renderHome();toast('已创建，记得顶部「同步」发给 Hermes');
};
document.getElementById('mb').onclick=()=>{
  const n=document.getElementById('mn').value.trim(),l=document.getElementById('ml').value.trim();
  if(!n||!l){toast('名称和链接都要填');return;}
  ensureDraft();
  mats().push([n,l]);document.getElementById('mn').value='';document.getElementById('ml').value='';
  saveDraft();renderHome();
};

// ---- 项目进度页 ----
function renderProj(id){
  const p=projs().find(x=>x.id===id);if(!p){location.hash='';return;}
  const doneN=Math.max(Math.min(p.stage-1,4),0),pct=Math.min(p.stage-1,4)/4*100;
  const steps=STEPS.map((s,i)=>{
    const n=i+1;
    const st=p.stage>=5?'done':p.stage===0?'todo':n<p.stage?'done':n===p.stage?'doing':'todo';
    let acts='';
    if(st==='doing')acts=`<button data-c="${esc('工作台：《'+p.title+'》完成 Step '+n+'，推进下一步')}">✅ 完成这步，进入 Step ${n+1}</button>`;
    if(st==='todo'&&n===1&&p.stage===0)acts=`<button data-c="${esc('工作台：《'+p.title+'》开始 Step 1，做用户调研和钩子池')}">▶ 开始 Step 1</button>`;
    if(st==='todo'&&p.stage>0&&n===p.stage+1)acts=`<button class="ghost" data-c="${esc('工作台：《'+p.title+'》开始 Step '+n)}">▶ 开始 Step ${n}</button>`;
    return `<div class="step ${st==='done'?'done':st==='doing'?'doing':''}">
      <div class="head"><span class="no">${s[0]}</span><span class="who">${s[1]}</span><span class="st">${LB[st]}</span></div>
      <div class="desc">${s[2]}</div>${acts?`<div class="acts">${acts}</div>`:''}</div>`;
  }).join('');
  const shotBtn=p.status==='script'
    ?`<button class="ghost" style="margin-top:4px" data-c="${esc('工作台：《'+p.title+'》拍摄完成，移到已拍作品')}">🎬 拍摄完成，移入已拍作品</button>`
    :'<div class="now">🎬 已拍摄完成</div>';
  const links=(p.extra||[]).map(l=>`<a href="${esc(l[1])}">${esc(l[0])}</a>`).join(' ｜ ');
  document.getElementById('view-proj').innerHTML=`
    <span class="back" onclick="location.hash=''">← 返回首页</span>
    <div class="now">📍 <b>${esc(p.title)}</b> — ${STAGELB(p.stage)}${p.status==='shot'?'（已拍）':''}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="bartxt">进度 ${doneN}/4${links?` ｜ ${links}`:''}</div>
    ${steps}${shotBtn}
    <div class="foot">完成按钮把指令复制到剪贴板，粘贴回 Hermes 发送；Hermes 更新本页后 ⌘R 刷新。</div>`;
  document.getElementById('view-proj').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
    if(window.hermes&&window.hermes.send){window.hermes.send(b.dataset.c);return;}
    navigator.clipboard.writeText(b.dataset.c).then(()=>toast('已复制，粘贴回 Hermes 聊天框发送'));});
}
function route(){
  const h=location.hash;
  const isP=h.startsWith('#/p/');
  document.getElementById('view-home').style.display=isP?'none':'';
  document.getElementById('view-proj').style.display=isP?'':'none';
  document.getElementById('apph').innerHTML=isP?'🎬 项目进度':'🗂 创作工作台 <button class="mini" id="editbtn">✎ 编辑</button>';
  if(isP)renderProj(h.slice(4));else renderHome();
}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
